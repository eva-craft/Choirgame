<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Симулятор Хора — ноты (поющий)</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body { margin: 0; background: #0d0805; font-family: 'Georgia', serif; color: #f5e6c8; overflow: hidden; }
  #game { display: flex; height: 100vh; }

  #stage {
    flex: 1; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(120,90,40,.35), transparent 60%),
      linear-gradient(180deg, #2a1a0f 0%, #1a0f08 45%, #0d0805 100%);
  }
  #stage::before {
    content:''; position:absolute; inset:0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 120px);
    pointer-events:none;
  }

  #staffArea {
    position: absolute; top: 0; left: 0; right: 0; height: 54%;
    background: linear-gradient(180deg, #f5efd8, #e8dfc0 85%, #d4c9a4);
    border-bottom: 3px solid #8a6a2a;
    box-shadow: 0 6px 24px rgba(0,0,0,.6), inset 0 -20px 40px rgba(120,90,40,.15);
    overflow: hidden;
    color: #1a1208;
  }
  #staffArea::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,250,230,.6), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(180,160,120,.2), transparent 50%);
    pointer-events:none;
  }
  #staffLabel {
    position: absolute; top: 3px; left: 12px; font-size: 11px;
    color: #6a4a1a; opacity: .9; letter-spacing: 1.5px; text-transform: uppercase;
    z-index: 3;
  }
  #staffSub {
    position: absolute; top: 3px; right: 14px; font-size: 11px;
    color: #6a4a1a; letter-spacing: .5px; z-index: 3;
  }

  #floor {
    position: absolute; bottom: 0; left: 0; right: 0; height: 46%;
    background:
      repeating-linear-gradient(90deg, #3a2716 0 64px, #32200e 64px 128px),
      linear-gradient(180deg, rgba(0,0,0,.4), transparent 20%);
    border-top: 5px solid #5a3d1a;
    box-shadow: inset 0 10px 30px rgba(0,0,0,.7);
  }
  #spotlight {
    position:absolute; top:-20%; left:50%; width:70%; height:130%;
    transform:translateX(-50%);
    background: radial-gradient(ellipse at 50% 0%, rgba(255,220,140,.10), transparent 55%);
    pointer-events:none;
  }

  .singer { position: absolute; width: 84px; text-align: center; cursor: pointer; z-index: 5; transition: filter .15s; }
  .singer:hover { filter: brightness(1.25) drop-shadow(0 0 6px rgba(255,215,0,.6)); z-index:10; }
  .singer .figure {
    position: relative; width: 60px; height: 78px; margin: 0 auto;
    transform-origin: 50% 100%;
    animation: sway 3.4s ease-in-out infinite, breathe 2.6s ease-in-out infinite;
  }
  @keyframes sway { 0%,100% { rotate: -1.5deg; } 50% { rotate: 1.5deg; } }
  @keyframes breathe { 0%,100% { scale: 1; } 50% { scale: 1.03; } }
  .singer:nth-child(3n) .figure { animation-delay: -1.1s, -1.1s; }
  .singer:nth-child(3n+1) .figure { animation-delay: -2.2s, -2.2s; }
  .head {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #f0d3a8, #b9824e 70%, #8a5a2b);
    border: 1px solid rgba(0,0,0,.35); z-index: 3;
  }
  .head::before {
    content:''; position:absolute; top:-3px; left:-2px; right:-2px; height:16px;
    border-radius: 50% 50% 40% 40%;
    background: linear-gradient(180deg,#3a2412,#241408);
  }
  .singer.female .head::before { height: 24px; left:-5px; right:-5px; border-radius: 50% 50% 45% 45%; background: linear-gradient(180deg,#4a2a14,#2a1608); }
  .eyes { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:18px; height:4px; z-index:4; }
  .eyes::before, .eyes::after { content:''; position:absolute; top:0; width:5px; height:4px; border-radius:50%; background:#1a0f08; animation: blink 4.5s infinite; }
  .eyes::before { left:0; } .eyes::after { right:0; }
  @keyframes blink { 0%,94%,100%{transform:scaleY(1);} 96%,98%{transform:scaleY(.1);} }
  .mouth { position:absolute; bottom:5px; left:50%; transform:translateX(-50%); width:8px; height:3px; border-radius:0 0 6px 6px; background:#5a1a1a; z-index:4; transition: height .1s, width .1s; }
  .singer.singing .mouth { height:9px; width:10px; background:#7a1f1f; }
  .torso {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:44px; height:48px; border-radius:18px 18px 8px 8px;
    background: linear-gradient(180deg, var(--robe, #6b2a2a), #2a0f0f);
    border: 1px solid rgba(0,0,0,.4);
    box-shadow: inset 0 0 10px rgba(0,0,0,.4);
  }
  .torso::after { content:''; position:absolute; top:4px; left:50%; transform:translateX(-50%); width:20px; height:6px; border-radius:0 0 10px 10px; background: rgba(255,255,255,.85); }
  .singer.singing .figure { animation-duration: 1.2s, .9s; }

  .singer .voice { font-size: 10px; margin-top: 3px; color: #ffe9a8; font-weight: bold; text-shadow: 0 1px 3px #000; letter-spacing: .5px; }
  .singer .lvl { font-size: 10px; color: #b0e0ff; text-shadow: 0 1px 2px #000; }
  .singer .lvlbar { height: 4px; width: 64px; margin: 2px auto 0; background: #181818; border-radius: 2px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  .singer .lvlbar > div { height: 100%; background: linear-gradient(90deg,#4caf50,#a5d6a7); width: 0%; transition: width .3s; }

  .note-pop {
    position: absolute; pointer-events: none; z-index: 20;
    animation: noteRise 1.1s ease-out forwards;
  }
  @keyframes noteRise {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    20%  { opacity: 1; transform: translateY(-8px) scale(1.1); }
    100% { transform: translateY(-46px) scale(.9); opacity: 0; }
  }

  #panel {
    width: 320px; background: #140c06; border-left: 3px solid #b8860b;
    display: flex; flex-direction: column; padding: 10px; gap: 7px;
    overflow-y: auto; flex-shrink: 0;
  }
  #panel h2 { margin: 6px 0 2px; font-size: 13px; color: #d4af37; letter-spacing: 1.5px; border-bottom: 1px solid #5a3d1a; padding-bottom: 3px; }
  .stat { display: flex; justify-content: space-between; font-size: 12px; }
  .stat b { color: #ffe9a8; }
  #stars { font-size: 18px; color: #333; letter-spacing: 2px; }
  #stars .on { color: #ffd700; text-shadow: 0 0 8px #ffd700; }

  .btn {
    background: linear-gradient(180deg,#6b4a1f,#3a2716); color: #f5e6c8;
    border: 1px solid #b8860b; border-radius: 6px; padding: 7px 10px;
    font-family: inherit; font-size: 12px; cursor: pointer; text-align: left; transition: .15s;
  }
  .btn:hover:not(:disabled) { background: linear-gradient(180deg,#8a6230,#4a341c); transform: translateX(2px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn small { display: block; color: #c0a060; font-size: 10px; }
  #shop { display: flex; flex-direction: column; gap: 4px; }

  #parties { display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
  .party-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; background: #1c1209; border-radius: 4px; border-left: 3px solid var(--c); }
  .party-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .party-row .cnt { margin-left: auto; color: #ffe9a8; }
  .party-row.missing .dot { background: #444; box-shadow: none; }
  .party-row.missing { opacity: .55; }

  #log { font-size: 11px; color: #c0a080; line-height: 1.4; min-height: 50px; max-height: 110px; overflow-y: auto; }
  #log div { padding: 2px 0; border-bottom: 1px dotted rgba(180,140,80,.15); }

  #result {
    position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none;
    align-items: center; justify-content: center; z-index: 100;
    flex-direction: column; gap: 14px; backdrop-filter: blur(3px);
  }
  #result h1 { color: #ffd700; margin: 0; font-size: 26px; text-align:center; }
  #result .rs { font-size: 56px; letter-spacing: 10px; color: #2a2a2a; }
  #result .rs .on { color: #ffd700; text-shadow: 0 0 24px #ffd700, 0 0 48px rgba(255,215,0,.5); }
  #result p { max-width: 500px; text-align: center; color: #ddd; font-size: 14px; line-height:1.5; }
  #result button { padding: 11px 30px; font-size: 15px; text-align:center; }
  #partyStats { display:flex; flex-direction: column; gap:6px; font-size:12px; color:#ccc; }
  #partyStats > div { padding: 4px 8px; border-radius: 4px; background: #1a1008; }

  #progress { height: 3px; background: #2a1a0f; border-radius: 2px; overflow: hidden; margin-top:2px; }
  #progress > div { height:100%; background: linear-gradient(90deg,#b8860b,#ffd700); width:0%; transition:width .3s; }

  .n-notehead {
    position: absolute;
    width: 11px; height: 8px;
    border-radius: 50% / 50%;
    background: #1a1208;
    transform: rotate(-22deg);
    box-shadow: inset -1px -1px 0 rgba(255,255,255,.15);
  }
  .n-notehead.hollow {
    background: transparent;
    border: 1.5px solid #1a1208;
    box-shadow: none;
    box-sizing: border-box;
    width: 12px; height: 9px;
  }
  .n-stem { position: absolute; width: 1.4px; background: #1a1208; }
  .n-flag {
    position: absolute; width: 8px; height: 9px;
    border-right: 1.6px solid #1a1208;
    border-bottom: 1.6px solid #1a1208;
    border-radius: 0 0 100% 0;
    transform-origin: top right;
  }
  .n-dot { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #1a1208; }
  .n-ledger { position: absolute; height: 1px; width: 15px; background: #1a1208; left: -2px; }
  .clef-mark { position: absolute; font-family: 'Bravura','Times New Roman',serif; color: #1a1208; line-height: 1; z-index: 2; }
  .meter-mark { position: absolute; font-family: 'Times New Roman',serif; font-weight: bold; color: #1a1208; text-align: center; line-height: 1; z-index: 2; }
  .staff-line { position: absolute; height: 1px; background: #4a3a20; }
  .bar-line { position: absolute; width: 1px; background: #4a3a20; }
  .bar-line.thick { width: 2.5px; }
  .n-accidental { position: absolute; font-family: 'Times New Roman',serif; font-size: 15px; font-weight: bold; color: #1a1208; line-height: 1; }
</style>
</head>
<body>
<div id="game">
  <div id="stage">
    <div id="staffArea">
      <div id="staffLabel">ПАРТИТУРА — 4 ПАРТИИ</div>
      <div id="staffSub"></div>
    </div>
    <div id="floor"><div id="spotlight"></div></div>
  </div>

  <div id="panel">
    <h2>ХОР «ЗОЛОТЫЕ НОТЫ»</h2>
    <div class="stat"><span>Монеты:</span><b id="coins">150</b></div>
    <div class="stat"><span>Репутация:</span><b id="rep">5.0</b></div>
    <div class="stat"><span>Уровень:</span><b id="levelNum">1 / 10</b></div>
    <div class="stat"><span>Произведение:</span><b id="songName">—</b></div>
    <div class="stat"><span>Звёзды:</span><span id="stars"></span></div>
    <div id="progress"><div></div></div>

    <h2>ПАРТИИ В ХОРЕ</h2>
    <div id="parties"></div>

    <h2>МАГАЗИН ПЕВЦОВ</h2>
    <div id="shop"></div>

    <h2>УПРАВЛЕНИЕ</h2>
    <button class="btn" id="startBtn">▶ Начать песню</button>
    <button class="btn" id="resetBtn" style="font-size:10px;opacity:.7;">↺ Сброс прогресса</button>

    <h2>ЖУРНАЛ</h2>
    <div id="log"></div>
  </div>
</div>

<div id="result">
  <h1 id="resTitle">Песня окончена!</h1>
  <div class="rs" id="resStars">☆☆☆</div>
  <p id="resText"></p>
  <div id="partyStats"></div>
  <button class="btn" id="nextBtn">Далее</button>
</div>

const state = {
  coins: 150, reputation: 5, level: 1, songIndex: 0,
  starsEarned: 0, singers: [], playing: false,
  currentSong: null, noteTimer: null, noteIdx: 0,
  scoreNotes: [], timeline: [], results: [],
  partyResults: { S:{gold:0,silver:0,red:0,missed:0}, A:{gold:0,silver:0,red:0,missed:0}, T:{gold:0,silver:0,red:0,missed:0}, B:{gold:0,silver:0,red:0,missed:0} },
  nextId: 1,
};

const staffArea = document.getElementById('staffArea');
const floorEl = document.getElementById('floor');

/* ============================================================
   ХОРИСТЫ
   ============================================================ */
function makeSinger(type, opts={}) {
  const v = VOICE_TYPES[type];
  const s = {
    id: state.nextId++, type,
    skill: opts.skill ?? (15 + Math.random()*25),
    form: opts.form ?? 60 + Math.random()*20,
    x:0, y:0, singingTimer:null, regenTimer:null,
  };
  state.singers.push(s);
  renderSinger(s);
  startFormRegen(s);
  placeSingers();
  return s;
}
function renderSinger(s) {
  const v = VOICE_TYPES[s.type];
  const el = document.createElement('div');
  el.className = 'singer' + (v.female ? ' female' : '');
  el.style.setProperty('--robe', v.robe);
  el.innerHTML = `
    <div class="figure">
      <div class="head"><div class="eyes"></div><div class="mouth"></div></div>
      <div class="torso"></div>
    </div>
    <div class="voice">${v.name}</div>
    <div class="lvl">форма <span class="lvlnum">${Math.round(s.form)}</span></div>
    <div class="lvlbar"><div></div></div>`;
  el.dataset.id = s.id;
  el.addEventListener('click', () => upgradeSinger(s.id));
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); fireSinger(s.id); });
  s.el = el;
  s.figureEl = el.querySelector('.figure');
  floorEl.appendChild(el);
  updateSingerVisual(s);
}
function updateSingerVisual(s) {
  if (!s.el) return;
  s.el.querySelector('.lvlnum').textContent = Math.round(s.form);
  const bar = s.el.querySelector('.lvlbar > div');
  bar.style.width = s.form + '%';
  const color = s.form > 60 ? 'linear-gradient(90deg,#4caf50,#a5d6a7)'
              : s.form > 30 ? 'linear-gradient(90deg,#e0a020,#ffd700)'
              : 'linear-gradient(90deg,#c02020,#ff6666)';
  bar.style.background = color;
  s.el.classList.toggle('tired', s.form < 25);
}
function placeSingers() {
  const n = state.singers.length; if (!n) return;
  const w = floorEl.clientWidth, h = floorEl.clientHeight;
  const cols = Math.max(1, Math.min(n, Math.ceil(n/2)));
  const spacingX = w / (cols + 1);
  const spacingY = Math.min(84, h * 0.30);
  const sorted = [...state.singers].sort((a,b) =>
    PARTY_ORDER.indexOf(VOICE_TYPES[a.type].family) -
    PARTY_ORDER.indexOf(VOICE_TYPES[b.type].family));
  sorted.forEach((s, i) => {
    const c = i % cols, r = Math.floor(i/cols);
    const x = spacingX * (c+1) - 42;
    const y = 30 + r * spacingY;
    s.x = x; s.y = y;
    s.el.style.left = x + 'px';
    s.el.style.top  = y + 'px';
    s.el.style.zIndex = 5 + r;
  });
}
function animateSinging(s, durMs) {
  if (!s.el) return;
  s.el.classList.add('singing');
  clearTimeout(s.singingTimer);
  s.singingTimer = setTimeout(() => s.el.classList.remove('singing'), durMs);
  s.figureEl.animate(
    [{ transform:'scale(1)' }, { transform:'scale(1.06)' }, { transform:'scale(1)' }],
    { duration: Math.min(700, durMs), easing:'ease-in-out' }
  );
}
const FORM_MAX = 100;
const FORM_DECAY_PER_NOTE = { gold: 0.3, silver: 0.6, red: 1.2, missed: 0 };

function upgradeSinger(id) {
  const s = state.singers.find(x => x.id === id); if (!s) return;
  if (s.form >= FORM_MAX) { log('Певец в отличной форме!'); return; }
  const gain = 5 + state.reputation * 0.4;
  s.form = Math.min(FORM_MAX, s.form + gain);
  updateSingerVisual(s);
  showFormPop(s, `+${gain.toFixed(0)}`);
  log(`${VOICE_TYPES[s.type].name}: форма +${gain.toFixed(0)}`);
  s.el.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:220});
}

function decayForm(s, result) {
  const drop = FORM_DECAY_PER_NOTE[result] ?? 1;
  s.form = Math.max(0, s.form - drop);
  updateSingerVisual(s);
}

function startFormRegen(s) {
  clearInterval(s.regenTimer);
  s.regenTimer = setInterval(() => {
    if (state.playing) return;
    if (s.form >= FORM_MAX) return;
    s.form = Math.min(FORM_MAX, s.form + 0.3);
    updateSingerVisual(s);
  }, 1000);
}

function showFormPop(s, text) {
  const el = document.createElement('div');
  el.className = 'note-pop';
  el.style.cssText = `left:${s.x + 24}px;top:${s.y + 4}px;color:#7dff9b;
    font-size:12px;font-weight:bold;text-shadow:0 0 6px #2aff6a,0 0 2px #000;`;
  el.textContent = text;
  floorEl.appendChild(el);
  setTimeout(() => el.remove(), 900);
}
function fireSinger(id) {
  const idx = state.singers.findIndex(x => x.id === id); if (idx < 0) return;
  const s = state.singers[idx];
  const repLoss = Math.max(1, Math.round(VOICE_TYPES[s.type].rep * 0.6));
  state.reputation = Math.max(0, state.reputation - repLoss);
  s.el.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(20px)'}],{duration:400,fill:'forwards'}).onfinish = () => s.el.remove();
  state.singers.splice(idx, 1);
  setTimeout(placeSingers, 50); updateHUD();
  log(`${VOICE_TYPES[s.type].name} уволен. Репутация −${repLoss}`);
}

/* ============================================================
   МАГАЗИН

const shopEl = document.getElementById('shop');
function renderShop() {
  shopEl.innerHTML = '';
  Object.entries(VOICE_TYPES).forEach(([key, v]) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = `${v.name} <span style="color:${PARTIES[v.family].color}">[${v.family}]</span> — ${v.price}<small>+${v.rep} реп · ${midiToName(v.min)}–${midiToName(v.max)}</small>`;
    b.disabled = state.coins < v.price;
    b.onclick = () => buySinger(key);
    shopEl.appendChild(b);
  });
}
function buySinger(type) {
  const v = VOICE_TYPES[type];
  if (state.coins < v.price) return;
  state.coins -= v.price;
  state.reputation += v.rep;
  const s = makeSinger(type, {skill: 20 + Math.random()*15});
  updateSingerVisual(s); updateHUD();
  log(`Куплен ${v.name} [${v.family}]! Репутация +${v.rep}`);
}

/* ============================================================
   HUD
   ============================================================ */
function renderParties() {
  const el = document.getElementById('parties');
  el.innerHTML = '';
  PARTY_ORDER.forEach(fam => {
    const cnt = state.singers.filter(s => VOICE_TYPES[s.type].family === fam).length;
    const p = PARTIES[fam];
    const row = document.createElement('div');
    row.className = 'party-row' + (cnt === 0 ? ' missing' : '');
    row.style.setProperty('--c', p.color);
    row.innerHTML = `<span class="dot"></span><span>${p.name}</span><span class="cnt">${cnt} чел.</span>`;
    el.appendChild(row);
  });
}
function updateHUD() {
  document.getElementById('coins').textContent = Math.floor(state.coins);
  document.getElementById('rep').textContent = state.reputation.toFixed(1);
  document.getElementById('levelNum').textContent = state.level + ' / 10';
  document.getElementById('songName').textContent = SONGS[Math.min(state.songIndex, SONGS.length-1)].name;
  const starsEl = document.getElementById('stars');
  starsEl.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const sp = document.createElement('span');
    sp.textContent = '★';
    if (i < state.starsEarned) sp.className = 'on';
    starsEl.appendChild(sp);
  }
  document.getElementById('progress').firstElementChild.style.width = (state.songIndex+1)/10*100 + '%';
  renderShop(); renderParties();
}
function log(msg) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.textContent = '• ' + msg;
  el.prepend(d);
  if (el.children.length > 40) el.lastChild.remove();
}

/* ============================================================
   ПАРТИТУРА
   ============================================================ */
const MID_C_LINE = { treble: 11, bass: -10 };

function renderScore(song) {
  clearScore();
  const area = staffArea;
  const areaW = area.clientWidth;
  const areaH = area.clientHeight;
  const leftPad = 78;
  const rightPad = 24;
  const topPad = 26;

  const availableH = areaH - topPad - 20;
  const lineGap = 6.5;
  const staffLinesH = 4 * lineGap;
  const rowH = availableH / 4;

  PARTY_ORDER.forEach((fam, partyIdx) => {
    const top = topPad + partyIdx * rowH + (rowH - staffLinesH) / 2;
    const midY = top + staffLinesH / 2;
    const isBass = (fam === 'B');
    const refV = isBass ? MID_C_LINE.bass : MID_C_LINE.treble;

    if (partyIdx % 2 === 1) {
      const bg = document.createElement('div');
      bg.className = 'score-note-el';
      bg.style.cssText = `left:0;right:0;top:${top - 14}px;height:${staffLinesH + 28}px;
        background:rgba(180,160,120,.06);pointer-events:none;`;
      area.appendChild(bg);
    }

    const lbl = document.createElement('div');
    lbl.className = 'score-note-el';
    lbl.innerHTML = `<b style="color:${PARTIES[fam].color}">${fam}</b>`;
    lbl.style.cssText = `left:8px;top:${midY - 8}px;font-size:13px;font-family:Georgia;`;
    area.appendChild(lbl);

    for (let i = 0; i < 5; i++) {
      const ln = document.createElement('div');
      ln.className = 'score-note-el staff-line';
      ln.style.cssText = `left:${leftPad}px;right:${rightPad}px;top:${top + i*lineGap}px;`;
      area.appendChild(ln);
    }

    const clef = document.createElement('div');
    clef.className = 'score-note-el clef-mark';
    clef.textContent = isBass ? '𝄢' : '𝄞';
    clef.style.cssText = `left:${leftPad - 34}px;top:${top - (isBass ? 14 : 16)}px;
      font-size:${isBass ? 48 : 62}px;`;
    area.appendChild(clef);

    const meter = document.createElement('div');
    meter.className = 'score-note-el meter-mark';
    meter.innerHTML = `<div>${song.meter[0]}</div><div>${song.meter[1]}</div>`;
    meter.style.cssText = `left:${leftPad - 12}px;top:${top - 2}px;
      font-size:12px;line-height:${lineGap*1.1}px;`;
    area.appendChild(meter);

    if (song.keySig) {
      const count = Math.abs(song.keySig);
      const sym = song.keySig > 0 ? '♯' : '♭';
      const sharpPos = [8, 5, 9, 6, 3, 7, 4];
      const flatPos = [4, 7, 3, 6, 2, 5, 1];
      const positions = song.keySig > 0 ? sharpPos : flatPos;
      for (let i = 0; i < count && i < positions.length; i++) {
        const acc = document.createElement('div');
        acc.className = 'score-note-el n-accidental';
        acc.textContent = sym;
        const vPos = positions[i];
        const yOff = -(vPos - refV) * (lineGap / 2);
        acc.style.cssText = `left:${leftPad + 6 + i * 8}px;top:${midY + yOff - 10}px;font-size:14px;`;
        area.appendChild(acc);
      }
    }

    const totalBeats = song.bars.reduce((s, bar) => s + (bar[fam]||[]).reduce((a,n) => a+n[1], 0), 0);
    const staffW = areaW - leftPad - rightPad - 20;
    const beatW = staffW / Math.max(totalBeats, 1);

    let x = leftPad + (song.keySig ? 24 : 12);
    const afterKeyOffset = 26 + Math.abs(song.keySig) * 9;
    x = leftPad + afterKeyOffset;

    const remainingW = areaW - x - rightPad - 6;
    const beatW2 = remainingW / Math.max(totalBeats, 1);

    song.bars.forEach((bar, barIdx) => {
      const barNotes = bar[fam] || [];
      if (barIdx > 0) {
        const bl = document.createElement('div');
        bl.className = 'score-note-el bar-line';
        bl.style.cssText = `left:${x}px;top:${top}px;height:${staffLinesH}px;`;
        area.appendChild(bl);
      }

      let noteInBar = 0;
      barNotes.forEach(([v, d]) => {
        const y = midY - (v - refV) * (lineGap / 2);
        const noteEl = createNoteElement(v, d, y, top, staffLinesH, midY, lineGap, x);
        area.appendChild(noteEl);
        state.scoreNotes.push({ el: noteEl, party: fam, barIdx, noteInBar, v, d });
        noteInBar++;
        x += d * beatW2;
      });
    });

    const endBar = document.createElement('div');
    endBar.className = 'score-note-el bar-line thick';
    endBar.style.cssText = `left:${x + 2}px;top:${top}px;height:${staffLinesH}px;background:#1a1208;`;
    area.appendChild(endBar);
    const endBar2 = document.createElement('div');
    endBar2.className = 'score-note-el bar-line';
    endBar2.style.cssText = `left:${x - 3}px;top:${top}px;height:${staffLinesH}px;background:#1a1208;`;
    area.appendChild(endBar2);
  });

  document.getElementById('staffSub').textContent =
    `${song.name} · ${song.meter[0]}/${song.meter[1]} · ♩=${song.bpm}`;
}

function createNoteElement(v, d, y, staffTop, staffH, midY, lineGap, x) {
  const wrap = document.createElement('div');
  wrap.className = 'score-note-el';
  const isEmpty = d >= 2;
  const isWhole = d >= 4;
  const hasStem = !isWhole;
  const stemDir = (y > midY) ? -1 : 1;
  const stemH = 3 * lineGap;
  const hasFlag = d <= 0.5;

  const headW = 11, headH = 8;

  wrap.style.cssText = `left:${x}px;top:${y - headH/2}px;width:${headW + 2}px;height:1px;`;
  wrap.style.position = 'absolute';

  const head = document.createElement('div');
  head.className = 'n-notehead' + (isEmpty ? ' hollow' : '');
  head.style.left = '0px';
  head.style.top = '0px';
  wrap.appendChild(head);

  if (hasStem) {
    const stem = document.createElement('div');
    stem.className = 'n-stem';
    const stemX = stemDir > 0 ? headW - 1 : 1;
    const stemTop = stemDir > 0 ? 1 : -stemH + 1;
    stem.style.left = stemX + 'px';
    stem.style.top = stemTop + 'px';
    stem.style.height = (stemH - 1) + 'px';
    wrap.appendChild(stem);

    if (hasFlag) {
      const flag = document.createElement('div');
      flag.className = 'n-flag';
      const fx = stemX + (stemDir > 0 ? 1 : -7);
      const fy = stemDir > 0 ? 1 : -stemH + 1;
      flag.style.left = fx + 'px';
      flag.style.top = fy + 'px';
      if (stemDir < 0) flag.style.transform = 'rotate(180deg)';
      wrap.appendChild(flag);
    }
  }

  const topLineY = staffTop;
  const bottomLineY = staffTop + staffH;
  for (let ly = topLineY - lineGap; ly >= y - 0.5; ly -= lineGap) {
    const ledger = document.createElement('div');
    ledger.className = 'n-ledger';
    ledger.style.left = '-2px';
    ledger.style.top = (ly - (y - headH/2)) + 'px';
    wrap.appendChild(ledger);
  }
  for (let ly = bottomLineY + lineGap; ly <= y + 0.5; ly += lineGap) {
    const ledger = document.createElement('div');
    ledger.className = 'n-ledger';
    ledger.style.left = '-2px';
    ledger.style.top = (ly - (y - headH/2)) + 'px';
    wrap.appendChild(ledger);
  }

  return wrap;
}

function clearScore() {
  staffArea.querySelectorAll('.score-note-el').forEach(e => e.remove());
  state.scoreNotes = [];
}

function colorScoreNote(party, barIdx, noteInBar, color) {
  const sn = state.scoreNotes.find(n => n.party === party && n.barIdx === barIdx && n.noteInBar === noteInBar);
  if (!sn) return;
  const el = sn.el;
  el.querySelectorAll('.n-notehead').forEach(n => {
    if (n.classList.contains('hollow')) n.style.borderColor = color;
    else n.style.background = color;
  });
  el.querySelectorAll('.n-stem').forEach(n => n.style.background = color);
  el.querySelectorAll('.n-flag').forEach(n => n.style.borderColor = color);
  el.style.filter = `drop-shadow(0 0 4px ${color})`;
}

/* ============================================================
   ВЫБОР ПЕВЦА
   ============================================================ */
function pickSingerForParty(family) {
  const candidates = state.singers.filter(s => VOICE_TYPES[s.type].family === family);
  if (!candidates.length) return null;
  return candidates.reduce((best, s) => s.skill > best.skill ? s : best, candidates[0]);
}

/* ============================================================
   НОТА НАД ПЕВЦОМ
   ============================================================ */
function showNoteAbove(s, text, color) {
  const el = document.createElement('div');
  el.className = 'note-pop';
  el.innerHTML = `<div style="position:relative;width:16px;height:24px;">
    <div style="position:absolute;left:0;top:8px;width:11px;height:8px;border-radius:50%;background:${color};transform:rotate(-22deg);"></div>
    <div style="position:absolute;left:10px;top:-2px;width:1.4px;height:20px;background:${color};"></div>
    <div style="position:absolute;left:4px;top:28px;font-size:11px;color:${color};font-weight:bold;text-shadow:0 0 6px ${color},0 0 2px #000;white-space:nowrap;">${text}</div>
  </div>`;
  el.style.left = (s.x + 22) + 'px';
  el.style.top = (s.y - 4) + 'px';
  floorEl.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

/* ============================================================
   ТАЙМЛАЙН
   ============================================================ */
function buildTimeline(song) {
  const tl = [];
  song.bars.forEach((bar, barIdx) => {
    const events = [];
    PARTY_ORDER.forEach(fam => {
      if (!bar[fam]) return;
      let time = 0;
      bar[fam].forEach(([v, d], noteInBar) => {
        events.push({ time, v, d, party: fam, barIdx, noteInBar });
        time += d;
      });
    });
    events.sort((a,b) => a.time - b.time || PARTY_ORDER.indexOf(a.party) - PARTY_ORDER.indexOf(b.party));
    events.forEach(e => tl.push(e));
  });
  return tl;
}

/* ============================================================
   ИГРА
   ============================================================ */
const RESULT = { GOLD:'gold', SILVER:'silver', RED:'red', MISSED:'missed' };
const RESULT_COLORS = { gold:'#d4a017', silver:'#8a8a8a', red:'#c02020', missed:'#555' };

function startSong() {
  if (state.playing) return;
  if (!state.singers.length) { log('В хоре нет певцов!'); return; }
  const missing = PARTY_ORDER.filter(f => !state.singers.some(s => VOICE_TYPES[s.type].family === f));
  if (missing.length) log(`⚠ Нет партий: ${missing.map(f => PARTIES[f].name).join(', ')}`);

  state.playing = true;
  state.currentSong = SONGS[state.songIndex];
  state.results = [];
  state.singers.forEach(s => { s.form = Math.min(100, s.form + 8); updateSingerVisual(s); });
  state.starsEarned = 0;
  state.partyResults = { S:{gold:0,silver:0,red:0,missed:0}, A:{gold:0,silver:0,red:0,missed:0}, T:{gold:0,silver:0,red:0,missed:0}, B:{gold:0,silver:0,red:0,missed:0} };

  state.timeline = buildTimeline(state.currentSong);
  renderScore(state.currentSong);

  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = '♪ Играем...';
  log(`Начинаем «${state.currentSong.name}»`);

  const beatMs = 60000 / state.currentSong.bpm;
  let lastTime = 0;

  function scheduleFrom(idx) {
    if (!state.playing) return;
    if (idx >= state.timeline.length) { finishSong(); return; }
    const note = state.timeline[idx];
    const delay = Math.max(0, (note.time - lastTime)) * beatMs;
    lastTime = note.time;
    state.noteTimer = setTimeout(() => {
      if (!state.playing) return;
      playNote(note, beatMs);
      scheduleFrom(idx + 1);
    }, delay);
  }

  const first = state.timeline[0];
  state.noteTimer = setTimeout(() => {
    if (!first) { finishSong(); return; }
    playNote(first, beatMs);
    lastTime = first.time;
    scheduleFrom(1);
  }, 700 + (first ? first.time * beatMs : 0));

  function playNote(note, beatMs) {
    const { v, d, party, barIdx, noteInBar } = note;
    const durMs = d * beatMs;
    const singer = pickSingerForParty(party);
    let result;
        if (!singer) {
      result = RESULT.MISSED;
      state.partyResults[party].missed++;
      colorScoreNote(party, barIdx, noteInBar, RESULT_COLORS.missed);
       } else {
      // Форма — главный фактор. skill даёт небольшой бонус сверху,
      // но при form=100 результат гарантированно золотой.
      const f = singer.form / 100;
const isPerfect = singer.form >= 99.5;   // допуск на дробный decay
let goldChance;
if (isPerfect) {
  goldChance = 1;
} else {
  goldChance = Math.pow(f, 2.2);
}
      const silverChance = (1 - goldChance) * 0.9;    // остаток почти весь в серебро

      const roll = Math.random();
      if (roll < goldChance) result = RESULT.GOLD;
      else if (roll < goldChance + silverChance) result = RESULT.SILVER;
      else result = RESULT.RED;

      // Штраф репутации — мягче и только при действительно низкой репутации
      if (result === RESULT.GOLD && state.reputation < 3 && Math.random() < 0.15) {
        result = RESULT.SILVER;
      }

      state.partyResults[party][result]++;
      showNoteAbove(singer, midiToName(v), RESULT_COLORS[result]);
      animateSinging(singer, durMs);
      colorScoreNote(party, barIdx, noteInBar, RESULT_COLORS[result]);
      decayForm(singer, result);
      playChoir(v, durMs / 1000, result, party);
    }
    state.results.push(result);
  }
}

function midiToName(v) {
  const names = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const n = v + 60;
  return names[((n % 12) + 12) % 12] + (Math.floor(n/12) - 1);
}

/* ============================================================
   ЗВУК — ХОРОВЫЕ ГЛАСНЫЕ
   ============================================================ */
let audioCtx = null;
const SAMPLE_BASE = 261.63;           // C4 — на какой ноте «записаны» сэмплы
const sampleCache = {};               // { vowel: AudioBuffer }
let samplesReady = false;

/* ---------- Загрузка сэмплов из samples/*.wav ---------- */
/* Работает только если открыть HTML через http:// (локальный сервер).
   При file:// браузер блокирует fetch — тогда сработает формантный синтез. */
async function loadSamplesFromFiles() {
  if (location.protocol === 'file:') {
    // При file:// fetch к локальным файлам запрещён CORS — сразу выходим
    return 0;
  }
  const results = await Promise.allSettled(VOWELS.map(async v => {
    const res = await fetch(`samples/${v}.wav`);
    if (!res.ok) throw new Error('no file');
    const buf = await res.arrayBuffer();
    return { v, audio: await audioCtx.decodeAudioData(buf) };
  }));
  let loaded = 0;
  results.forEach(r => {
    if (r.status === 'fulfilled') { sampleCache[r.value.v] = r.value.audio; loaded++; }
  });
  return loaded;
}

/* Base64-сэмплы (замените "..." на реальные строки) */
const SAMPLE_B64 = {
  a: "",
  e: "UklGRi...",
  i: "UklGRi...",
  o: "UklGRi...",
  u: "UklGRi...",
};

function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}



/* ---------- Генерация сэмплов через формантный синтез ----------
   Если готовых файлов нет — синтезируем гласную C4 длиной 1.2 с
   в OfflineAudioContext. Звучит как «поющий» гласный звук.
------------------------------------------------------------------ */
function synthVowelBuffer(vowel, duration = 1.2) {
  const sampleRate = 44100;
  const length = Math.floor(sampleRate * duration);
  const offline = new OfflineAudioContext(1, length, sampleRate);

  // Форманты (F1, F2, F3) для гласных
  const FORMANTS = {
    a: [800, 1150, 2900],
    e: [400, 1600, 2700],
    i: [350, 1700, 2700],
    o: [450,  800, 2830],
    u: [325,  700, 2530],
  }[vowel];

  const osc = offline.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = SAMPLE_BASE;

  // Лёгкая вибрация для «живости»
  const lfo = offline.createOscillator();
  lfo.frequency.value = 5.5;
  const lfoGain = offline.createGain();
  lfoGain.gain.value = 2.5; // ±2.5 Гц
  lfo.connect(lfoGain).connect(osc.frequency);

  const out = offline.createGain();
  // Огибающая
  out.gain.setValueAtTime(0, 0);
  out.gain.linearRampToValueAtTime(0.8, 0.08);
  out.gain.setValueAtTime(0.8, duration - 0.2);
  out.gain.exponentialRampToValueAtTime(0.0001, duration);

  FORMANTS.forEach((f, i) => {
    const bp = offline.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = f;
    bp.Q.value = 14;
    const g = offline.createGain();
    g.gain.value = [1.0, 0.65, 0.35][i];
    osc.connect(bp).connect(g).connect(out);
  });

  // Немного низов, чтобы голос не был «тонким»
  const lp = offline.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 400;
  const lg = offline.createGain();
  lg.gain.value = 0.15;
  osc.connect(lp).connect(lg).connect(out);

  out.connect(offline.destination);
  osc.start(0);
  lfo.start(0);

  return offline.startRendering();
}
async function ensureSamples() {
  if (samplesReady) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const loaded = await loadSamplesFromFiles();

  if (loaded >= VOWELS.length) {
    log('✔ Загружены сэмплы гласных — хор поёт живыми голосами');
  } else {
    // Генерируем недостающие (или все, если открыто через file://)
    log('♫ Генерирую гласные (формантный синтез)...');
    await Promise.all(VOWELS.map(async v => {
      if (!sampleCache[v]) {
        try { sampleCache[v] = await synthVowelBuffer(v); }
        catch(e) { console.warn('synth fail', v, e); }
      }
    }));
    if (loaded > 0) {
      log(`✔ Голоса готовы (часть из файлов: ${loaded}/${VOWELS.length}, остальное — синтез)`);
    } else {
      log('✔ Голоса хора готовы (формантный синтез)');
    }
  }
  samplesReady = true;
}

/* ---------- Воспроизведение хоровой ноты ----------
   voices — несколько голосов с расстройкой (detune в центах).
   Партия выбирает гласную: S — «и», A — «а», T — «о», B — «у».
---------------------------------------------------------- */
function playChoir(v, durSec, result, party) {
  if (!audioCtx || !samplesReady) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const vowel = VOWEL_BY_PARTY[party] || 'a';
  // Для разнообразия иногда подмешиваем другую гласную
  const actualVowel = Math.random() < 0.15
    ? VOWELS[Math.floor(Math.random() * VOWELS.length)]
    : vowel;
  const buf = sampleCache[actualVowel];
  if (!buf) return;

  const targetFreq = 440 * Math.pow(2, (v + 60 - 69) / 12);
  const now = audioCtx.currentTime;

  // 4 голоса на ноту — звучит как небольшая группа певцов
  const voices = [
    { detune: -9, pan: -0.6, gain: 0.10 },
    { detune:  0, pan: -0.2, gain: 0.12 },
    { detune: +7, pan:  0.3, gain: 0.11 },
    { detune:+14, pan:  0.7, gain: 0.09 },
  ];

  const baseRate = targetFreq / SAMPLE_BASE;
  // Погрешность исполнения по типу результата
  let detuneErr = 0;
  if (result === RESULT.RED)    detuneErr = (Math.random() > 0.5 ? 1 : -1) * (0.03 + Math.random()*0.03); // ±3-6%
  if (result === RESULT.SILVER) detuneErr = (Math.random() > 0.5 ? 1 : -1) * 0.008;                          // ±0.8%
  if (result === RESULT.GOLD)   detuneErr = (Math.random() > 0.5 ? 1 : -1) * 0.002;                          // ±0.2%

  const totalDur = Math.max(0.12, durSec);
  const attack = 0.03;
  const release = 0.12;
  const sustain = Math.max(0.02, totalDur - attack - release);

  voices.forEach(({ detune, pan, gain }) => {
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = baseRate * (1 + detuneErr) * Math.pow(2, detune / 1200);

    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    if (panner) panner.pan.value = pan;

    const peak = gain * (result === RESULT.RED ? 0.7 : result === RESULT.SILVER ? 0.9 : 1.1);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(peak, now + attack);
    g.gain.setValueAtTime(peak, now + attack + sustain);
    g.gain.exponentialRampToValueAtTime(0.0001, now + attack + sustain + release);

    src.connect(g);
    if (panner) g.connect(panner).connect(audioCtx.destination);
    else g.connect(audioCtx.destination);

    src.start(now);
    src.stop(now + attack + sustain + release + 0.05);
  });
}

/* ============================================================
   ФИНАЛ
   ============================================================ */
function finishSong() {
  state.playing = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = '▶ Начать песню';

  const total = state.results.length;
  const gold = state.results.filter(r => r === RESULT.GOLD).length;
  const silver = state.results.filter(r => r === RESULT.SILVER).length;
  const red = state.results.filter(r => r === RESULT.RED).length;
  const missed = state.results.filter(r => r === RESULT.MISSED).length;
  const quality = total > 0 ? (gold + silver * 0.5) / total : 0;

  let stars;
  if (quality >= 0.75 && missed === 0) stars = 3;
  else if (quality >= 0.45) stars = 2;
  else stars = 1;

  state.starsEarned = stars;
  const reward = stars * 25 + gold * 2;
  state.coins += reward;
  state.reputation += stars * 0.5;

  document.getElementById('resTitle').textContent = `«${state.currentSong.name}»`;
  document.getElementById('resStars').innerHTML = [0,1,2].map(i => `<span class="${i<stars?'on':''}">★</span>`).join('');

  let partyHtml = '';
  PARTY_ORDER.forEach(fam => {
    const r = state.partyResults[fam];
    if (r.gold + r.silver + r.red + r.missed === 0) return;
    const hasSinger = state.singers.some(s => VOICE_TYPES[s.type].family === fam);
    partyHtml += `<div style="border-left:3px solid ${PARTIES[fam].color};padding-left:8px;">
      <b>${PARTIES[fam].name}</b>: <span style="color:#ffd700">★${r.gold}</span>
      <span style="color:#c0c0c0">◆${r.silver}</span>
      <span style="color:#ff4444">✕${r.red}</span>
      ${r.missed ? `<span style="color:#666">∅${r.missed}</span>` : ''}
      ${!hasSinger ? ' <i style="color:#c66">(нет партии!)</i>' : ''}
    </div>`;
  });
  document.getElementById('partyStats').innerHTML = partyHtml;

  document.getElementById('resText').innerHTML =
    `Золотых: <b>${gold}</b> · Серебряных: <b>${silver}</b> · Фальшивых: <b>${red}</b>${missed?` · Пропущено: <b>${missed}</b>`:''}<br>` +
    `Награда: <b>${reward}</b> монет · Репутация +${(stars*0.5).toFixed(1)}<br>` +
    (stars === 3 ? 'Великолепно! Все партии звучат слаженно.' :
     stars === 2 ? 'Хорошо! Но не хватает точности.' :
     missed > 0 ? 'Провал! Не все партии были в хоре.' :
     'Совсем фальшиво... Прокачайте певцов.');

  const nextBtn = document.getElementById('nextBtn');
  if (state.songIndex >= SONGS.length - 1) {
    nextBtn.textContent = 'Завершить тур';
    nextBtn.onclick = () => {
      document.getElementById('result').style.display = 'none';
      log('Вы прошли все 10 произведений! Браво!');
    };
  } else {
    nextBtn.textContent = 'Следующее произведение →';
    nextBtn.onclick = () => {
      document.getElementById('result').style.display = 'none';
      state.songIndex++; state.level = state.songIndex + 1; state.starsEarned = 0;
      renderScore(SONGS[state.songIndex]);
      updateHUD();
      log(`Уровень ${state.level}: «${SONGS[state.songIndex].name}»`);
    };
  }
  document.getElementById('result').style.display = 'flex';
  updateHUD();
  state.starsEarned = 0;
}

   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

  makeSinger('soprano');

  makeSinger('tenor');
  makeSinger('bass');

  updateHUD();

  // ▶ Первый клик разблокирует звук и подгружает/генерирует сэмплы
  document.getElementById('startBtn').onclick = async () => {
    if (!samplesReady) {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').textContent = '♫ Готовлю голоса...';
      try { await ensureSamples(); } catch(e) { console.error(e); }
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = '▶ Начать песню';
    }
    startSong();
  };

  document.getElementById('resetBtn').onclick = () => { if (confirm('Сбросить прогресс?')) location.reload(); };
  window.addEventListener('resize', () => {
    placeSingers();
    renderScore(SONGS[state.songIndex]);
  });
}
